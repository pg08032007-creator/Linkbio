<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@Porr4_kayc | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* Base e Reset para precisão */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1117; /* Preto absoluto do fundo */
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* Centraliza verticalmente na tela */
            min-height: 100vh; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* Evita scroll desnecessário */
        } 

        .container { 
            width: 330px; /* Largura exata medida na imagem */
            text-align: center; 
            padding-bottom: 50px; /* Compensa a centralização vertical para subir um pouco */
        } 

        .profile-pic { 
            width: 140px; /* Medida exata do círculo azul */
            height: 140px; 
            border-radius: 50%; 
            border: 4px solid #58a6ff; /* Borda azul vibrante */
            margin-bottom: 25px; /* Espaço até o nome */
            object-fit: cover; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.4); /* Glow mais visível */
        } 

        h1 { 
            font-size: 2.1rem; /* Tamanho do nome @Porr4_kayc */
            color: #ffffff; 
            margin-bottom: 5px; 
            font-weight: 700; 
            letter-spacing: -1px;
            text-decoration: underline; /* Linha embaixo do nome como na foto */
            text-underline-offset: 8px; /* Espaço da linha para o texto */
        } 

        .divider {
            height: 1px; /* Linha divisória fina */
            background-color: #30363d; /* Cinza escuro */
            margin: 15px auto 40px; /* Espaço grande até o primeiro botão */
            width: 75%; /* Não ocupa toda a largura */
        }

        .link-button { 
            display: flex; 
            align-items: center; /* Centraliza verticalmente o conteúdo interno */
            background-color: #161b22; /* Fundo do card */
            color: #ffffff; 
            text-decoration: none; 
            height: 100px; /* Altura fixa para manter o botão "quadrado" */
            padding: 0 25px; /* Espaçamento horizontal */
            margin-bottom: 15px; /* Espaço entre botões */
            border: 1px solid #30363d; 
            border-radius: 20px; /* Bordas arredondadas exatas */
            transition: all 0.2s ease; 
            width: 100%;
            box-sizing: border-box;
        } 

        .link-button i { 
            font-size: 2.2rem; /* Ícones grandes e pesados */
            width: 70px; /* Espaço reservado para o ícone alinhar à esquerda */
            text-align: left;
        } 

        .button-text {
            flex-grow: 1; /* Ocupa o restante do espaço */
            font-size: 1.2rem; /* Tamanho do texto */
            font-weight: 600;
            line-height: 1.25; /* Espaçamento entre as duas linhas de texto */
            text-align: center; /* Texto centralizado */
            padding-right: 40px; /* Compensa o espaço do ícone para centralizar o texto */
        }

        /* Efeito de clique */
        .link-button:active {
            transform: scale(0.96);
            background-color: #1f242c;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_20260326_064921_114.jpg" alt="Foto de Perfil" class="profile-pic">

    <h1>@Porr4_kayc</h1>
    <div class="divider"></div>

    <a href="mailto:Christopherkayc74@gmail.com" class="link-button">
        <i class="fas fa-envelope"></i>
        <span class="button-text">E-mail para<br>Contato</span>
    </a>

    <a href="https://youtube.com/@kaldim244?si=PaFHzbLobG9wnPyI" target="_blank" class="link-button">
        <i class="fab fa-youtube"></i>
        <span class="button-text">Canal no<br>YouTube</span>
    </a>

    <a href="https://discord.gg/gmsyfGggup" target="_blank" class="link-button">
        <i class="fab fa-discord"></i>
        <span class="button-text">Servidor no<br>Discord</span>
    </a>

    <a href="https://pg08032007-creator.github.io/Portf-lio-/" target="_blank" class="link-button">
        <i class="fab fa-github"></i>
        <span class="button-text">Meus Projetos</span>
    </a>
</div>

</body>
</html>
