<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Porr4_kayc | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1117; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* Alinha ao topo para permitir scroll se necessário */
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px;
            box-sizing: border-box;
        } 

        .container { 
            width: 100%; 
            max-width: 320px; /* Largura mais estreita como na foto */
            text-align: center; 
        } 

        .profile-pic { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid #58a6ff; 
            margin-bottom: 20px; 
            object-fit: cover; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); 
        } 

        h1 { 
            font-size: 2rem; 
            margin-bottom: 5px; 
            font-weight: 700; 
            text-decoration: underline; /* Linha embaixo do nome como na foto */
            text-underline-offset: 8px;
        } 

        .divider {
            height: 2px;
            background-color: #30363d;
            margin: 20px auto 30px;
            width: 80%;
        }

        .link-button { 
            display: flex; 
            align-items: center; 
            background-color: #161b22; 
            color: #ffffff; 
            text-decoration: none; 
            padding: 25px 20px; /* Mais padding vertical para dar altura */
            margin-bottom: 15px; 
            border: 1px solid #30363d; 
            border-radius: 20px; /* Bordas mais arredondadas */
            transition: all 0.2s ease; 
            width: 100%;
            box-sizing: border-box;
        } 

        .link-button i { 
            font-size: 1.8rem; /* Ícones grandes */
            width: 50px; 
            text-align: left;
        } 

        .button-text {
            flex-grow: 1;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            padding-right: 30px; /* Compensa o espaço do ícone para centralizar o texto */
        }

        /* Efeito de clique */
        .link-button:active {
            transform: scale(0.95);
            background-color: #1f242c;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_20260326_064921_114.jpg" alt="Foto de Perfil" class="profile-pic">

    <h1>@Porr4_kayc</h1>

    <a href="mailto:Christopherkayc74@gmail.com" class="link-button">

        <span class="button-text">Canal no<br>YouTube</span>
    </a>

    <a href="https://discord.gg/gmsyfGggup" target="_blank" class="link-button">

    </a>

        <i class="fab fa-github"></i>
        <span class="button-text">Meus Projetos</span>
    </a>
</div>

</body>
</html>
