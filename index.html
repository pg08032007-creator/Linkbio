<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@Porr4_kayc | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        } 

        .container { 
            width: 100%; 
            max-width: 500px; /* Aumentado para preencher mais a tela */
            text-align: center; 
        } 

        .profile-pic { 
            width: 160px; /* Bem maior agora */
            height: 160px; 
            border-radius: 50%; 
            border: 5px solid #58a6ff; 
            margin-bottom: 25px; 
            object-fit: cover; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            background-color: #30363d; 
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.4); 
        } 

        h1 { 
            font-size: 2.2rem; /* Fonte bem grande e visível */
            color: #ffffff; 
            margin-bottom: 40px; 
            font-weight: 900; 
            letter-spacing: -1px;
        } 

        .link-button { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #161b22; 
            color: #ffffff; 
            text-decoration: none; 
            padding: 22px; /* Botões muito mais altos e fáceis de clicar */
            margin-bottom: 18px; 
            border: 2px solid #30363d; /* Borda mais grossa */
            border-radius: 18px; /* Cantos mais arredondados e modernos */
            transition: all 0.2s ease-in-out; 
            font-weight: 700; 
            font-size: 1.2rem; /* Texto do link aumentado */
            width: 100%;
            box-sizing: border-box;
        } 

        .link-button i { 
            margin-right: 15px; 
            font-size: 1.5rem; /* Ícones maiores */
            width: 30px; 
            text-align: center; 
        } 

        .link-button:active { 
            transform: scale(0.96); /* Efeito de clique real no celular */
        }

        /* Cores de destaque no hover/foco */ 
        .yt-hover:hover { background-color: #FF0000; border-color: #FF0000; } 
        .dc-hover:hover { background-color: #5865F2; border-color: #5865F2; } 
        .gh-hover:hover { background-color: #238636; border-color: #2ea043; } 
        .em-hover:hover { background-color: #58a6ff; border-color: #58a6ff; } 
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_20260326_064921_114.jpg" alt="Foto de Perfil" class="profile-pic">

    <h1>@Porr4_kayc</h1>

    <a href="mailto:Christopherkayc74@gmail.com" class="link-button em-hover">
        <i class="fas fa-envelope"></i> E-mail para Contato
    </a>

    <a href="https://youtube.com/@kaldim244?si=PaFHzbLobG9wnPyI" target="_blank" class="link-button yt-hover">
        <i class="fab fa-youtube"></i> Canal no YouTube
    </a>

    <a href="https://discord.gg/gmsyfGggup" target="_blank" class="link-button dc-hover">
        <i class="fab fa-discord"></i> Servidor no Discord
    </a>

    <a href="https://pg08032007-creator.github.io/Portf-lio-/" target="_blank" class="link-button gh-hover">
        <i class="fab fa-github"></i> Meus Projetos
    </a>
</div>

</body>
</html>
