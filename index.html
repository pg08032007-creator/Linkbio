<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Porr4_kayc | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        } 

        .container { 
            width: 100%; 
            max-width: 420px; /* Aumentei levemente */
            text-align: center; 
        } 

        .profile-pic { 
            width: 130px; /* maior igual segunda imagem */
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid #58a6ff; 
            margin-bottom: 18px; 
            object-fit: cover; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            background-color: #30363d; 
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.35); 
        } 

        h1 { 
            font-size: 1.8rem; /* maior */
            color: #ffffff; 
            margin-bottom: 30px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        } 

        .link-button { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #161b22; 
            color: #ffffff; 
            text-decoration: none; 
            padding: 20px; /* MAIS ALTO (principal mudança) */
            margin-bottom: 18px; /* mais espaçamento entre botões */
            border: 1px solid #30363d; 
            border-radius: 16px; /* mais arredondado estilo segunda imagem */
            transition: all 0.25s ease; 
            font-weight: 600; 
            font-size: 1.1rem; /* texto maior */
            width: 100%;
            box-sizing: border-box;
        } 

        .link-button i { 
            margin-right: 14px; 
            font-size: 1.3rem; 
            width: 28px; 
            text-align: center; 
        } 

        /* Efeito HOVER mais moderno */
        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* Efeitos de cores */ 
        .yt-hover:hover { background-color: #FF0000; border-color: #FF0000; } 
        .dc-hover:hover { background-color: #5865F2; border-color: #5865F2; } 
        .gh-hover:hover { background-color: #238636; border-color: #2ea043; } 
        .em-hover:hover { background-color: #58a6ff; border-color: #58a6ff; } 
        
        /* Feedback mobile */
        .link-button:active {
            transform: scale(0.97);
            background-color: #1f242c;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_20260326_064921_114.jpg" alt="Foto de Perfil" class="profile-pic">

    </a>

        <i class="fab fa-youtube"></i> Canal no YouTube
    </a>

    <a href="https://discord.gg/gmsyfGggup" target="_blank" class="link-button dc-hover">
        <i class="fab fa-discord"></i> Servidor no Discord
    </a>

    <a href="https://pg08032007-creator.github.io/Portf-lio-/" target="_blank" class="link-button gh-hover">
        <i class="fab fa-github"></i> Meus Projetos
    </a>
</div>

</body>
</html>
